name: Deploy RateGuru artifact
description: Upload and deploy an immutable RateGuru release through restricted SSH

inputs:
  deployment-target:
    required: true
    description: Deployment target ID from the RateGuru target registry

  deploy-host:
    required: true
    description: SSH server hostname or IP

  deploy-port:
    required: false
    default: "22"
    description: SSH server port

  deploy-user:
    required: true
    description: Restricted deployment user

  deploy-incoming:
    required: true
    description: Target-specific incoming artifact directory

  deploy-wrapper:
    required: true
    description: Target-specific sudo deployment wrapper

  deploy-root:
    required: true
    description: Target root containing current and releases

  ssh-private-key:
    required: true
    description: Deployment SSH private key

  known-hosts:
    required: true
    description: Verified SSH known_hosts entry

  release-id:
    required: true
    description: Immutable server release identifier

  artifact-path:
    required: true
    description: Local release tar.gz path

  checksum-path:
    required: true
    description: Local sha256 checksum path

  run-migrations:
    required: false
    default: "true"
    description: Run Laravel migrations before switching current

  restore-operation:
    required: false
    default: ""
    description: >-
      Restore operation ID this deployment is the controlled code alignment
      for. Empty (the default) is an ordinary deployment and changes nothing
      about this action's behaviour. Non-empty switches the server-side deploy
      into alignment mode, where the target stays held throughout and
      migrations are forbidden.

  recovery-operation:
    required: false
    default: ""
    description: >-
      Host recovery operation ID this deployment is the controlled recovery
      deployment for. Empty (the default) is an ordinary deployment and changes
      nothing about this action's behaviour. Non-empty switches the server-side
      deploy into recovery mode, where a rebuilt replacement host receives the
      exact commit its recovered data belongs to, stays held throughout, keeps
      `previous` absent and forbids migrations. Mutually exclusive with
      restore-operation.

runs:
  using: composite

  steps:
    - name: Validate deployment inputs
      shell: bash
      env:
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        RELEASE_ID: ${{ inputs.release-id }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        CHECKSUM_PATH: ${{ inputs.checksum-path }}
        RUN_MIGRATIONS: ${{ inputs.run-migrations }}
        RESTORE_OPERATION: ${{ inputs.restore-operation }}
        RECOVERY_OPERATION: ${{ inputs.recovery-operation }}
      run: |
        set -Eeuo pipefail

        # Rejects empty, uppercase, slash, whitespace, shell metacharacters
        # and a flag-shaped value (a leading "-") in one closed character
        # class — none of those characters are members of [a-z0-9-].
        target_regex='^[a-z0-9]+(-[a-z0-9]+)*$'

        [[ "${DEPLOYMENT_TARGET}" =~ ${target_regex} ]] || {
          echo "Invalid deployment target: ${DEPLOYMENT_TARGET}" >&2
          exit 1
        }

        release_regex='^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$'

        [[ "${RELEASE_ID}" =~ ${release_regex} ]] || {
          echo "Invalid release ID: ${RELEASE_ID}" >&2
          exit 1
        }

        test -f "${ARTIFACT_PATH}"
        test -f "${CHECKSUM_PATH}"

        artifact_name="$(basename "${ARTIFACT_PATH}")"
        checksum_name="$(basename "${CHECKSUM_PATH}")"
        expected_artifact_name="rateguru-${RELEASE_ID}.tar.gz"

        if [[ "${artifact_name}" != "${expected_artifact_name}" ]]; then
          echo "Artifact name ${artifact_name} does not match release ID ${RELEASE_ID}; expected ${expected_artifact_name}" >&2
          exit 1
        fi

        test "${checksum_name}" = "${artifact_name}.sha256"

        case "${RUN_MIGRATIONS}" in
          true|false)
            ;;
          *)
            echo "run-migrations must be true or false" >&2
            exit 1
            ;;
        esac

        # Controlled deployments. Nothing below runs for an ordinary
        # deployment, whose contract is byte-for-byte what it was.

        # A target is either a live one whose restored data awaits its code, or
        # a replacement host being rebuilt — never both. Refused at the
        # perimeter as well as on the server, so a mistaken workflow never
        # opens a connection at all.
        if [[ -n "${RESTORE_OPERATION}" ]] && [[ -n "${RECOVERY_OPERATION}" ]]; then
          echo "restore-operation and recovery-operation are mutually exclusive: a live restore awaiting code alignment and a host recovery awaiting its first code are different operations, and no deployment serves both" >&2
          exit 1
        fi

        # The same closed format the server enforces, checked here so a
        # malformed value never reaches an SSH command line.
        operation_regex='^[0-9]{8}-[0-9]{6}-[0-9a-f]{6}$'

        if [[ -n "${RESTORE_OPERATION}" ]]; then
          if [[ ! "${RESTORE_OPERATION}" =~ ${operation_regex} ]]; then
            echo "Invalid restore operation ID: ${RESTORE_OPERATION}" >&2
            exit 1
          fi

          # An alignment installs the exact commit the restored data was taken
          # under; a migration is by definition a change to that data's shape,
          # so the two requests contradict each other and neither is the safe
          # reading of a contradiction. The server refuses this too — this is
          # the same rule stated at the perimeter.
          if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
            echo "run-migrations must be false when restore-operation is set: a controlled code alignment never migrates the data it is aligning to" >&2
            exit 1
          fi
        fi

        if [[ -n "${RECOVERY_OPERATION}" ]]; then
          if [[ ! "${RECOVERY_OPERATION}" =~ ${operation_regex} ]]; then
            echo "Invalid recovery operation ID: ${RECOVERY_OPERATION}" >&2
            exit 1
          fi

          # Identical reasoning: a recovery deployment installs the exact
          # commit the RECOVERED data belongs to, so migrating it would change
          # the shape of the very data that commit was chosen to match.
          if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
            echo "run-migrations must be false when recovery-operation is set: a controlled recovery deployment never migrates the data it is recovering onto" >&2
            exit 1
          fi
        fi

    - name: Configure SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -Eeuo pipefail

        key_path="${RUNNER_TEMP}/rateguru_deploy_key"
        known_hosts_path="${RUNNER_TEMP}/rateguru_known_hosts"

        install -m 0600 /dev/null "${key_path}"
        install -m 0600 /dev/null "${known_hosts_path}"

        printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_path}"
        printf '%s\n' "${KNOWN_HOSTS}" > "${known_hosts_path}"

        ssh-keygen -y -f "${key_path}" >/dev/null

        {
          echo "RATEGURU_SSH_KEY_PATH=${key_path}"
          echo "RATEGURU_KNOWN_HOSTS_PATH=${known_hosts_path}"
        } >> "${GITHUB_ENV}"

    - name: Test SSH connection
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.deploy-host }}
        DEPLOY_PORT: ${{ inputs.deploy-port }}
        DEPLOY_USER: ${{ inputs.deploy-user }}
      run: |
        set -Eeuo pipefail

        ssh \
          -p "${DEPLOY_PORT}" \
          -i "${RATEGURU_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
          "${DEPLOY_USER}@${DEPLOY_HOST}" \
          'id'

    - name: Upload artifact
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.deploy-host }}
        DEPLOY_PORT: ${{ inputs.deploy-port }}
        DEPLOY_USER: ${{ inputs.deploy-user }}
        DEPLOY_INCOMING: ${{ inputs.deploy-incoming }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        CHECKSUM_PATH: ${{ inputs.checksum-path }}
      run: |
        set -Eeuo pipefail

        scp \
          -P "${DEPLOY_PORT}" \
          -i "${RATEGURU_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
          "${ARTIFACT_PATH}" \
          "${CHECKSUM_PATH}" \
          "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_INCOMING}/"

    - name: Deploy release
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.deploy-host }}
        DEPLOY_PORT: ${{ inputs.deploy-port }}
        DEPLOY_USER: ${{ inputs.deploy-user }}
        DEPLOY_INCOMING: ${{ inputs.deploy-incoming }}
        DEPLOY_WRAPPER: ${{ inputs.deploy-wrapper }}
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        RELEASE_ID: ${{ inputs.release-id }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        RUN_MIGRATIONS: ${{ inputs.run-migrations }}
        RESTORE_OPERATION: ${{ inputs.restore-operation }}
        RECOVERY_OPERATION: ${{ inputs.recovery-operation }}
      run: |
        set -Eeuo pipefail

        echo "Deployment target: ${DEPLOYMENT_TARGET}"

        # DEPLOY_WRAPPER must be the generic, target-aware wrapper — never a
        # deprecated, per-environment one, which does not understand
        # --target at all. Failing closed here, before the remote command is
        # ever built, gives a clear diagnostic instead of a confusing remote
        # "unknown argument: --target" failure.
        deploy_wrapper_basename="$(basename "${DEPLOY_WRAPPER}")"

        if [[ "${deploy_wrapper_basename}" != "rateguru-deploy" ]]; then
          echo "DEPLOY_WRAPPER must be the generic rateguru-deploy wrapper (got: ${DEPLOY_WRAPPER})" >&2
          exit 1
        fi

        artifact_name="$(basename "${ARTIFACT_PATH}")"
        remote_artifact="${DEPLOY_INCOMING}/${artifact_name}"
        remote_checksum="${remote_artifact}.sha256"

        printf -v remote_command \
          'sudo -n %q --target %q --release %q --artifact %q --checksum %q' \
          "${DEPLOY_WRAPPER}" \
          "${DEPLOYMENT_TARGET}" \
          "${RELEASE_ID}" \
          "${remote_artifact}" \
          "${remote_checksum}"

        if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
          remote_command+=" --migrate"
        fi

        # The ONLY thing this action tells the server about a controlled
        # deployment: which operation it is finishing. It never names a commit —
        # the required commit is read on the server, out of that operation's own
        # persisted state, and the artifact is checked against it there.
        if [[ -n "${RESTORE_OPERATION}" ]]; then
          echo "Controlled restore alignment for operation ${RESTORE_OPERATION}"

          printf -v restore_argument ' --restore-operation %q' "${RESTORE_OPERATION}"
          remote_command+="${restore_argument}"
        fi

        if [[ -n "${RECOVERY_OPERATION}" ]]; then
          echo "Controlled recovery deployment for operation ${RECOVERY_OPERATION}"

          printf -v recovery_argument ' --recovery-operation %q' "${RECOVERY_OPERATION}"
          remote_command+="${recovery_argument}"
        fi

        ssh \
          -p "${DEPLOY_PORT}" \
          -i "${RATEGURU_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
          "${DEPLOY_USER}@${DEPLOY_HOST}" \
          "${remote_command}"

    - name: Verify active release
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.deploy-host }}
        DEPLOY_PORT: ${{ inputs.deploy-port }}
        DEPLOY_USER: ${{ inputs.deploy-user }}
        DEPLOY_ROOT: ${{ inputs.deploy-root }}
        EXPECTED_RELEASE: ${{ inputs.release-id }}
      run: |
        set -Eeuo pipefail

        current_path="${DEPLOY_ROOT%/}/current"
        release_json="${current_path}/release.json"

        printf -v current_command \
          'basename "$(readlink -f %q)"' \
          "${current_path}"

        actual_release="$(
          ssh \
            -p "${DEPLOY_PORT}" \
            -i "${RATEGURU_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${current_command}"
        )"

        test "${actual_release}" = "${EXPECTED_RELEASE}"

        printf -v metadata_command 'cat %q' "${release_json}"

        metadata="$(
          ssh \
            -p "${DEPLOY_PORT}" \
            -i "${RATEGURU_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${metadata_command}"
        )"

        metadata_release="$(
          printf '%s' "${metadata}" |
            jq -r '.release'
        )"

        test "${metadata_release}" = "${EXPECTED_RELEASE}"

        printf '%s\n' "${metadata}"
        echo "Verified active release ${actual_release}"

    - name: Remove temporary SSH material
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f \
          "${RATEGURU_SSH_KEY_PATH:-}" \
          "${RATEGURU_KNOWN_HOSTS_PATH:-}"
