name: Release to production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rateguru-production-release
  cancel-in-progress: false

jobs:
  # Production source and release policy — the only part of the build that is
  # production-specific. The mechanical build itself lives in the shared
  # .github/actions/build-rateguru action.
  validate:
    name: Validate production tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      source-sha: ${{ steps.release.outputs.source_sha }}
      source-tag: ${{ steps.release.outputs.source_tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout production tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and main ancestry
        id: release
        shell: bash
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          tag_regex='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9][A-Za-z0-9._-]*)?$'

          if [[ ! "${SOURCE_TAG}" =~ ${tag_regex} ]]; then
            echo "Invalid production tag: ${SOURCE_TAG}" >&2
            echo "Expected examples:" >&2
            echo "  v0.5.0" >&2
            echo "  v0.5.0-product-import" >&2
            exit 1
          fi

          version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

          git fetch \
            --no-tags \
            origin \
            main:refs/remotes/origin/main

          source_sha="$(
            git rev-list \
              -n 1 \
              "${SOURCE_TAG}"
          )"

          test -n "${source_sha}"

          if ! git merge-base \
              --is-ancestor \
              "${source_sha}" \
              refs/remotes/origin/main
          then
            echo "Tag ${SOURCE_TAG} does not point to a commit contained in main." >&2
            exit 1
          fi

          {
            echo "source_sha=${source_sha}"
            echo "source_tag=${SOURCE_TAG}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

          echo "Production release validated"
          echo "Tag:       ${SOURCE_TAG}"
          echo "Version:   ${version}"
          echo "Commit:    ${source_sha}"

  # Build once. Both deployment jobs below consume this job's outputs, so the
  # tarball verified on staging is byte-for-byte the tarball promoted to
  # production — there is no second build anywhere in this workflow.
  build:
    name: Build immutable production artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      release-id: ${{ steps.build.outputs.release-id }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      workflow-artifact-name: ${{ steps.build.outputs.workflow-artifact-name }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      # Production builds one tree: the validated tag commit is both the
      # application source and the trusted tooling, exactly as it is for the
      # deployment jobs below. A production release stays fully described by
      # its own tag rather than by whatever develop happens to hold.
      - name: Build immutable release artifact
        id: build
        uses: ./.github/actions/build-rateguru
        with:
          source-root: ${{ github.workspace }}

          source-ref: ${{ needs.validate.outputs.source-tag }}
          release-version: ${{ needs.validate.outputs.version }}

          # Refuses to build anything but the commit `validate` proved is a
          # semantic tag contained in main.
          expected-source-sha: ${{ needs.validate.outputs.source-sha }}

          workflow-artifact-prefix: rateguru-production

          # A production artifact outlives its run: it is the thing that was
          # promoted, and stays downloadable for as long as GitHub allows.
          artifact-retention-days: "90"

          # Production releases are validated builds, not fast ones: the
          # dependency definition is checked strictly and nothing is restored
          # from a cache.
          validate-composer: "true"

          release-metadata: >-
            {
              "source_tag": ${{ toJSON(needs.validate.outputs.source-tag) }},
              "version": ${{ toJSON(needs.validate.outputs.version) }},
              "targets": ["staging-main", "tits-guru"]
            }

  deploy-staging:
    name: Verify release on staging
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    # This job mutates staging-main, so it joins the same domain every other
    # staging mutation uses — a manual staging deploy or rollback can no
    # longer overlap a release's staging verification. The workflow-level
    # rateguru-production-release group above still serializes whole
    # production releases against production rollbacks. Both are orchestration
    # on top of, never a replacement for, the server-side deployment lock.
    concurrency:
      group: rateguru-staging-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout trusted deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download immutable production artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.workflow-artifact-name }}
          path: ${{ runner.temp }}/rateguru-production-release

      - name: Deploy release artifact to staging
        uses: ./.github/actions/deploy-rateguru
        with:
          deployment-target: staging-main

          deploy-host: ${{ vars.DEPLOY_HOST }}
          deploy-port: ${{ vars.DEPLOY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}
          deploy-incoming: ${{ vars.DEPLOY_INCOMING }}
          deploy-wrapper: ${{ vars.DEPLOY_WRAPPER }}
          deploy-root: ${{ vars.DEPLOY_ROOT }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

          release-id: ${{ needs.build.outputs.release-id }}

          artifact-path: ${{ runner.temp }}/rateguru-production-release/${{ needs.build.outputs.artifact-name }}
          checksum-path: ${{ runner.temp }}/rateguru-production-release/${{ needs.build.outputs.artifact-name }}.sha256

          run-migrations: "true"

      - name: Write staging verification summary
        shell: bash
        env:
          SOURCE_TAG: ${{ needs.validate.outputs.source-tag }}
          RELEASE_ID: ${{ needs.build.outputs.release-id }}
        run: |
          {
            echo "## Staging verification passed"
            echo
            echo "- Tag: \`${SOURCE_TAG}\`"
            echo "- Release: \`${RELEASE_ID}\`"
            echo "- Artifact will be promoted without rebuilding."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Runs inside the staging job, after the deployment action has already
      # completed its health check and active-release verification, so the
      # markers can only appear for a genuinely successful staging deployment.
      # Same shared implementation deploy-staging.yml and the rollback action
      # use — there is one place a successful deployment is recorded.
      - name: Record staging deployment in Sentry and Nightwatch
        uses: ./.github/actions/record-rateguru-deployment
        with:
          deployment-target: staging-main
          environment: staging

          release-id: ${{ needs.build.outputs.release-id }}
          source-sha: ${{ needs.validate.outputs.source-sha }}

          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}

          deploy-host: ${{ vars.DEPLOY_HOST }}
          deploy-port: ${{ vars.DEPLOY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  deploy-production:
    name: Deploy approved release to production
    needs:
      - validate
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout trusted deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the same verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.workflow-artifact-name }}
          path: ${{ runner.temp }}/rateguru-production-release

      # tits-guru intentionally remains lifecycle=planned and unprovisioned —
      # activation is explicitly out of scope for this cutover. This
      # job is pinned to its real target ID so it fails closed, before
      # touching anything, until the target is provisioned and activated in
      # a later phase. Routing production to staging-main or activating
      # tits-guru here would violate the accepted rollout plan.
      - name: Deploy verified artifact to production
        uses: ./.github/actions/deploy-rateguru
        with:
          deployment-target: tits-guru

          deploy-host: ${{ vars.DEPLOY_HOST }}
          deploy-port: ${{ vars.DEPLOY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}
          deploy-incoming: ${{ vars.DEPLOY_INCOMING }}
          deploy-wrapper: ${{ vars.DEPLOY_WRAPPER }}
          deploy-root: ${{ vars.DEPLOY_ROOT }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

          release-id: ${{ needs.build.outputs.release-id }}

          artifact-path: ${{ runner.temp }}/rateguru-production-release/${{ needs.build.outputs.artifact-name }}
          checksum-path: ${{ runner.temp }}/rateguru-production-release/${{ needs.build.outputs.artifact-name }}.sha256

          run-migrations: "true"

      - name: Write production deployment summary
        shell: bash
        env:
          SOURCE_TAG: ${{ needs.validate.outputs.source-tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
          RELEASE_ID: ${{ needs.build.outputs.release-id }}
        run: |
          {
            echo "## Production deployment completed"
            echo
            echo "- Tag: \`${SOURCE_TAG}\`"
            echo "- Commit: \`${SOURCE_SHA}\`"
            echo "- Release: \`${RELEASE_ID}\`"
            echo "- Artifact was verified on staging before promotion."
          } >> "${GITHUB_STEP_SUMMARY}"

      # The environment stays `production` for every production target. Which
      # brand was deployed is carried by the deployment_target tag on the
      # events themselves, not by inventing production-<brand> environments.
      - name: Record production deployment in Sentry and Nightwatch
        uses: ./.github/actions/record-rateguru-deployment
        with:
          deployment-target: tits-guru
          environment: production

          release-id: ${{ needs.build.outputs.release-id }}
          source-sha: ${{ needs.validate.outputs.source-sha }}

          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}

          deploy-host: ${{ vars.DEPLOY_HOST }}
          deploy-port: ${{ vars.DEPLOY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
